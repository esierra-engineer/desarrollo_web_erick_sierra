<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Básica</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <!--<link rel="stylesheet" href="/resources/demos/style.css">-->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
</head>
<body>
    <header>
        Informar Actividad
    </header>
    <main>
      <div id="dialog-confirm" title="Confirmacion">
        <p>¿Está seguro que desea agregar esta actividad?</p>
      </div>

        <form>
          <div>
            <h1>Donde</h1>
            <label for="select-region">Region</label>
            <select name="select-region" id="select-region" required>
                <option value="">Seleccione una Región</option>
            </select>
            <label for="select-comuna">Comuna</label>
            <select name="select-comuna" id="select-comuna" required>
                <option value="">Seleccione una Comuna</option>
            </select>
            <label>Sector</label>
            <input type="text" maxlength="100">  
          </div>

          <div>
          <h1>Quien Organiza</h1>

          <label>Nombre</label>
          <input type="text" maxlength="200" required>

          <label>email</label>
          <input type="email" maxlength="100" required>

          <label>Celular</label>
          <input type="tel" maxlength="12">
          <label>Contactar por</label>
          <select name="select-contact" id="select-contact">
            <option value="">Seleccione</option>
          </select>

          <div id="contact-input"></div>
          
        </div>
        <div>
          <h1>Cuando y de que trata</h1>
          <label>Dia hora Inicio</label>
          <input type="datetime-local" id="input-init-date" name="input-init-date" required>

        <label>Dia Hora Termino</label>
        <input type="datetime-local" id="input-end-date" name="input-end-date">

        <label>Descripcion</label>
        <textarea cols="50" rows="10"></textarea>

        <label>Tema</label>
        <select id="select-tema" name="select-tema" required>
          <option label="Selexione"></option>
        </select>

        <div id="tema-input"></div>

        <label>Foto</label>
        <input type="file" required>

        </div>
        <div>
          <br>
          <button id="btn-submit" name="btn-submit" type="submit">Agregar esta actividad</button>
        </div>

        <div id="div-btn-goback">
          
        </div>

        </form>
    </main>
    <footer>
        &copy; 2025 Mi Página
    </footer>

<script src="../js/region_comuna.js"></script> 
<script src="../js/select.js"></script> 
</body>
</html>
